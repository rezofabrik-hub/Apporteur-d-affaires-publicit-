name: Publication du site

# Régénère les pages HTML puis publie l'ensemble sur la branche `gh-pages`,
# qui est la source configurée pour GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Installation de Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Génération des pages HTML
        run: node build/build.js

      - name: Publication sur la branche gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Régénération du site"
          git push origin HEAD:refs/heads/gh-pages --force
